<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>个人标注工具</title>
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/FlowerGrove" />
    <link rel="stylesheet" href="lib/fontawesome/all.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/drop-hint.css" />
    <link rel="stylesheet" href="css/top-panel.css" />
    <link rel="stylesheet" href="css/bottom-bar.css" />
    <link rel="stylesheet" href="css/type-dock.css" />
    <link rel="stylesheet" href="css/toast.css" />
    <link rel="stylesheet" href="css/session-banner.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/preview.css" />
    <link rel="stylesheet" href="css/context-menu.css" />
    <link rel="stylesheet" href="css/inspector.css" />
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="drop-hint" id="dropHint">
        <span class="drop-hint__icon"><i class="fa-solid fa-file-pdf"></i></span>
        <span class="drop-hint__text">拖放 PDF 图纸到此处</span>
        
    </div>

    <div class="session-banner" id="sessionBanner">
        <span id="sessionBannerText">检测到上次未保存的标注记录</span>
        <button type="button" id="sessionBannerRestore">恢复</button>
        <button type="button" id="sessionBannerDismiss">忽略</button>
        <button type="button" id="sessionBannerClear" title="永久清除并忽略">不再提示</button>
    </div>

    <!-- 左侧类型浮动栏 -->
    <aside class="type-dock marker-tool" id="typeDock">
        <div class="type-dock__header">
            <button class="btn-add-type" id="addTypeBtn" title="添加自定义类型">+</button>
        </div>
        <div class="type-dock__title">仪表</div>
        <div class="type-chips" id="typeChips"></div>
    </aside>

    

    <!-- 顶部工具栏 -->
    <div class="top-panel" id="topPanel">
        <div class="number-input-group marker-tool">
            <label for="numberInput"><i class="fa-solid fa-hashtag" style="font-size:11px; color:#888;"></i></label>
            <input type="text" id="numberInput" class="number-input" value="001" inputmode="numeric" maxlength="4" />
        </div>
        <div class="divider marker-tool"></div>
        <div class="control-group marker-tool">
            <label for="radiusSlider"><i class="fa-regular fa-circle" style="font-size:11px; color:#888;"></i></label>
            <input type="range" id="radiusSlider" class="size-slider" min="6" max="60" value="26" step="0.5" />
            <span class="size-value" id="radiusValue">26</span>
        </div>
        <div class="control-group marker-tool">
            <label for="fontSizeSlider"><i class="fa-solid fa-font" style="font-size:11px; color:#888;"></i></label>
            <input type="range" id="fontSizeSlider" class="size-slider" min="5" max="45" value="12" step="0.5" />
            <span class="size-value" id="fontSizeValue">12</span>
        </div>
        <div class="divider marker-tool"></div>
        <button class="btn-icon marker-tool" id="undoBtn" title="撤销 (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i><span class="tooltip">撤销</span></button>
        <button class="btn-icon marker-tool" id="redoBtn" title="重做 (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i><span class="tooltip">重做</span></button>
        <button class="btn-icon marker-tool" id="eraserBtn" title="点击已有标记可删除"><i class="fa-solid fa-eraser"></i><span class="tooltip">删除标记</span></button>
        <button class="btn-icon danger" id="clearBtn" title="清空所有数据"><i class="fa-solid fa-trash-can"></i><span class="tooltip">清空</span></button>
        <button class="btn-icon" id="importBtn" title="导入PDF"><i class="fa-solid fa-folder-open"></i><span class="tooltip">导入</span></button>
        <button class="btn-icon" id="settingsBtn" title="设置"><i class="fa-solid fa-gear"></i><span class="tooltip">设置</span></button>
        </div>

    <div class="settings-backdrop" id="settingsBackdrop">
        <div class="settings-modal" role="dialog" aria-label="设置">
            <h3>设置 <button type="button" id="settingsCloseBtn" title="关闭">×</button></h3>
            <div class="settings-scroll">
            <div class="settings-col">
            <div class="settings-row">
                <label>编号补零<small>如 001、002（仪表显示）</small></label>
                <select id="settingPadDigits">
                    <option value="2">2 位 (01)</option>
                    <option value="3" selected>3 位 (001)</option>
                    <option value="4">4 位 (0001)</option>
                </select>
            </div>
            <div class="settings-row">
                <label>文档页脚信息<small>文件名 / 尺寸mm</small></label>
                <input type="checkbox" id="settingShowCaption" checked />
            </div>
            <div class="settings-row setting-sub" id="settingCaptionNameRow">
                <label>└ 页脚显示文件名</label>
                <input type="checkbox" id="settingCaptionName" checked />
            </div>
            <div class="settings-row setting-sub" id="settingCaptionSizeRow">
                <label>└ 页脚显示尺寸</label>
                <input type="checkbox" id="settingCaptionSize" checked />
            </div>
            </div><!-- .settings-col -->
            </div><!-- .settings-scroll -->
            <div class="settings-actions">
                <button type="button" class="btn-secondary" id="settingsCancelBtn">取消</button>
                <button type="button" class="btn-primary" id="settingsSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 底部工具栏 -->
    <div class="bottom-bar">
        <span class="page-count" id="pageCount"></span>
        <button class="btn-icon" id="exportExcelBottomBtn" title="导出统计 Excel"><i class="fa-solid fa-file-excel"></i><span class="tooltip">Excel</span></button>
        <button class="btn-icon" id="exportBtn" title="导出带标记的PDF"><i class="fa-solid fa-file-arrow-down"></i><span class="tooltip">导出PDF</span></button>
        <button class="btn-icon" id="exportBothBtn" title="同步导出 Excel 和 PDF"><i class="fa-solid fa-download"></i><span class="tooltip">同步导出</span></button>
        <button class="btn-icon" id="previewBtn" title="预览标注数据"><i class="fa-solid fa-table-list"></i><span class="tooltip">预览</span></button>
    </div>

    <!-- 预览窗口：占屏幕 90%，直接渲染内存数据 -->
    <div class="preview-overlay" id="previewOverlay" hidden>
        <div class="preview-window">
            <header class="preview-header">
                <div class="preview-header__left">
                    <h1 class="preview-title">
                        <i class="fa-solid fa-table-list"></i>
                        标注数据预览
                    </h1>
                    <span class="preview-meta" id="pvMeta"></span>
                </div>
                <div class="preview-header__right">
                    <button type="button" class="preview-manage-cols" id="pvManageColsBtn" title="管理绑定列">
                        <i class="fa-solid fa-columns"></i>
                    </button>
                    <button type="button" class="preview-close" id="previewCloseBtn" title="关闭预览（Esc）">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </header>

            <div class="preview-tabs-wrap">
                <nav class="preview-tabs">
                    <button class="preview-tab active" data-sheet="detail">Detail List</button>
                    <button class="preview-tab" data-sheet="summary">Summary</button>
                </nav>
            </div>

            <main class="preview-body">
                <div class="preview-empty" id="pvEmpty" hidden>
                    <i class="fa-solid fa-inbox"></i>
                    <p>还没有标记，请先在图纸上点击标注</p>
                </div>

                <section class="preview-sheet" id="pvSheet-detail">
                    <div class="preview-scroll">
                        <table class="preview-table" id="pvTable-detail"></table>
                    </div>
                </section>

                <section class="preview-sheet" id="pvSheet-summary" hidden>
                    <div class="preview-scroll">
                        <div class="preview-summary">
                            <div class="preview-summary__section" id="pvSummaryFile"></div>
                        </div>
                    </div>
                </section>

                </main>

            <footer class="preview-footer">
                <span id="pvFooter"></span>
            </footer>

            <!-- 批量编辑工具栏 -->
            <div class="pv-batch-bar" id="pvBatchBar" hidden>
                <span class="pv-batch-bar__count" id="pvBatchCount">已选 0 项</span>
                <select class="pv-batch-bar__field" id="pvBatchField">
                    <option value="">选择字段…</option>
                </select>
                <input type="text" class="pv-batch-bar__value" id="pvBatchValue" placeholder="输入新值…" />
                <button class="pv-batch-bar__apply" id="pvBatchApply" disabled>应用到选中</button>
                <button class="pv-batch-bar__cancel" id="pvBatchCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 仪表属性管理对话框 -->
    <div class="cf-dialog-backdrop" id="cfAttrBackdrop" hidden>
        <div class="cf-dialog cf-dialog--wide" role="dialog" aria-label="仪表属性列表">
            <h3>仪表属性列表 <button type="button" id="cfAttrClose" title="关闭">&times;</button></h3>
            <div class="cf-dialog-row">
                <label>属性名</label>
                <input type="text" id="cfAttrLabel" placeholder="如：制造商、型号" maxlength="20" />
            </div>
            <div class="cf-dialog-row">
                <label>描述</label>
                <input type="text" id="cfAttrDesc" placeholder="属性说明（选填）" maxlength="60" />
            </div>
            <div class="cf-dialog-actions" style="justify-content:space-between;">
                <button type="button" class="btn-primary" id="cfAttrAdd">添加属性</button>
                <button type="button" class="btn-secondary" id="cfAttrCancel">关闭</button>
            </div>
            <div class="cf-manage-list" id="cfAttrList"></div>
        </div>
    </div>

    <!-- 列绑定对话框（+ 号添加列） -->
    <div class="cf-dialog-backdrop" id="cfBindBackdrop" hidden>
        <div class="cf-dialog" role="dialog" aria-label="添加绑定列">
            <h3>添加绑定列 <button type="button" id="cfBindClose" title="关闭">&times;</button></h3>
            <div class="cf-dialog-row">
                <label>列名</label>
                <input type="text" id="cfBindName" placeholder="如：制造商、供电方式" maxlength="20" />
            </div>
            <div class="cf-dialog-row">
                <label>绑定属性</label>
                <select id="cfBindField">
                    <option value="">选择属性…</option>
                </select>
            </div>
            <div class="cf-dialog-actions">
                <button type="button" class="btn-secondary" id="cfBindCancel">取消</button>
                <button type="button" class="btn-primary" id="cfBindConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 列绑定管理对话框 -->
    <div class="cf-dialog-backdrop" id="cfBindManageBackdrop" hidden>
        <div class="cf-dialog cf-dialog--wide" role="dialog" aria-label="管理绑定列">
            <h3>管理绑定列 <button type="button" id="cfBindManageClose" title="关闭">&times;</button></h3>
            <div class="cf-manage-list" id="cfBindManageList"></div>
        </div>
    </div>

    <div class="marker-context-menu" id="markerContextMenu">
        <div class="mcm-header">
            <div class="mcm-header-left">
                <button class="mcm-btn-icon" id="mcmCloseBtn" title="关闭">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button class="mcm-btn-icon mcm-btn-danger" id="mcmDeleteBtn" title="删除标记">
                    <i class="fa-solid fa-trash"></i>
                </button>
                <button class="mcm-btn-icon" id="mcmInspectorBtn" title="打开属性面板 (Ctrl+1)">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
            <span class="mcm-title" id="mcmTitle">标记属性</span>
            <div class="mcm-header-right"></div>
        </div>
        <div class="mcm-body">
            <div class="mcm-field">
                <label class="mcm-label">Tag No.</label>
                <input type="text" class="mcm-input" id="mcmTagNumber" />
            </div>
            <div class="mcm-field">
                <label class="mcm-label">Location</label>
                <input type="text" class="mcm-input" id="mcmLocation" />
            </div>
        </div>
        <div class="mcm-footer">
            <button class="mcm-btn" id="mcmCloseBtn2">关闭</button>
            <button class="mcm-btn mcm-btn-primary" id="mcmSaveBtn">保存</button>
        </div>
    </div>

    <!-- Inspector 属性面板（右侧停靠，类似 Unity/Godot Inspector） -->
    <div class="inspector-panel" id="inspectorPanel">
        <div class="inspector-header">
            <div class="inspector-header-left">
                <div class="inspector-header-icon" id="inspectorIcon"></div>
                <span class="inspector-header-title" id="inspectorTitle">Inspector</span>
            </div>
            <div class="inspector-header-actions">
                <button class="inspector-btn-icon" id="inspectorCloseBtn" title="关闭 (Esc)"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <nav class="inspector-tabs" id="inspectorTabs">
            <button class="inspector-tab active" data-tab="builtin">仪表属性</button>
            <button class="inspector-tab" data-tab="custom">自定义属性</button>
        </nav>
        <div class="inspector-body" id="inspectorBody">
            <div class="inspector-empty" id="inspectorEmpty">
                <i class="fa-solid fa-cube"></i>
                <p>选择一个标记查看属性<br>左键点击标记或右键选择属性</p>
            </div>
            <div id="inspectorFields" hidden></div>
        </div>
        
    </div>

    <div class="toast" id="toast"></div>
    <div class="global-tooltip" id="globalTooltip"></div>

    <!-- 简单输入对话框（替代 prompt()） -->
    <div class="prompt-dialog-backdrop" id="promptDialogBackdrop" hidden>
        <div class="prompt-dialog" role="dialog">
            <div class="prompt-dialog__title" id="promptDialogTitle">输入</div>
            <input type="text" class="prompt-dialog__input" id="promptDialogInput" maxlength="30" />
            <div class="prompt-dialog__actions">
                <button type="button" class="btn-secondary" id="promptDialogCancel">取消</button>
                <button type="button" class="btn-primary" id="promptDialogConfirm">确定</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple />

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/log.js"></script>
    <script src="assets/instrument-types.js"></script>
    <script src="js/types.js"></script>
    <script src="js/state.js"></script>
    <script src="js/history.js"></script>
    <script src="js/autosave.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/render.js"></script>
    <script src="js/pdf-loader.js"></script>
    <script src="js/export-pdf.js"></script>
    <script src="js/excel-config.js"></script>
    <script src="js/export-excel.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/main.js"></script>
    <script src="js/inspector.js"></script>
    <script src="js/events.js"></script>
<div id="opLogWrap">
    <div id="opLog"></div>
    <div id="opLogToggle" title="折叠日志"></div>
</div>
</body>
</html>
